# Stub service definition. Do not deploy from a cloud agent.
# Operator one-liner lives in README.md:
# gcloud run deploy phenomatch-web --source . --project=devo-holding --region=us-west1
#
# Do not use --allow-unauthenticated (org policy blocks allUsers IAM).
# Public access: run.googleapis.com/invoker-iam-disabled=true
# (gcloud: --invoker-iam-check=disabled). Already true on the live service.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: phenomatch-web
  labels:
    app: phenomatch
    holding: devo
  annotations:
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      containers:
        - image: us-west1-docker.pkg.dev/devo-holding/phenomatch/web:latest
          ports:
            - containerPort: 8080
          env:
            - name: GCP_PROJECT_ID
              value: devo-holding
            - name: GCP_REGION
              value: us-west1
            - name: CLOUD_RUN_SERVICE
              value: phenomatch-web
            - name: PORT
              value: '8080'
            - name: HOST
              value: 0.0.0.0
